<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoStar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #0f1115;
  --fg: #e8e8e8;
  --muted: #9aa0aa;
  --line: #2a2f3a;
  --soft: #1a1e27;
  --a: #3b82f6;
  --b: #fb923c;
  --path: #4ade80;
  --bad: #f87171;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.app { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 24px; font-weight: 600; margin: 0; }
.loaded { color: var(--muted); margin: 2px 0 0; font-size: 14px; }

.loadbox { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px dashed var(--line); border-radius: 4px; }
.loadbox label { font-weight: 600; }
.loadbox p { margin: 0; color: var(--muted); font-size: 14px; }
.loadbox .status { color: var(--fg); min-height: 21px; font-variant-numeric: tabular-nums; }
input[type=file] { font: inherit; max-width: 100%; }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 200px; }
.field label { font-size: 13px; color: var(--muted); }
input[type=text] { width: 100%; min-width: 0; font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
input[type=text]:focus-visible, button:focus-visible, input[type=file]:focus-visible { outline: 2px solid var(--a); outline-offset: 1px; }
input[type=text].bad { border-color: var(--bad); }
button { font: inherit; padding: 7px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--soft); color: var(--fg); cursor: pointer; }
button.go { background: var(--a); border-color: var(--a); color: #fff; }
button.go:hover { background: #1d4fc4; }
button:disabled { opacity: 0.6; cursor: default; }
.err { flex-basis: 100%; color: var(--bad); font-size: 14px; margin: 0; min-height: 21px; }

.panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pane { position: relative; height: clamp(320px, 55vh, 560px); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
canvas:active { cursor: grabbing; }
.hud { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
.hud .name { font-weight: 600; font-size: 14px; }
.counts { text-align: right; font-size: 13px; color: var(--muted); }
.counts .n { font-size: 20px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.state { position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: var(--muted); pointer-events: none; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
#chain { margin: 0; font-weight: 600; }
#verdict { margin: 0; color: var(--muted); }

@media (max-width: 820px) { .panes { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<main class="app">
  <header>
    <h1>CoStar</h1>
    <p class="loaded" id="loaded">Loading the data...</p>
  </header>

  <form class="controls" id="ctl" autocomplete="off" hidden>
    <div class="field"><label for="inA">First actor</label><input type="text" id="inA" list="namesA" spellcheck="false"></div>
    <div class="field"><label for="inB">Second actor</label><input type="text" id="inB" list="namesB" spellcheck="false"></div>
    <button type="submit" class="go" id="run">Search</button>
    <p class="err" id="err" role="status"></p>
    <datalist id="namesA"></datalist><datalist id="namesB"></datalist>
  </form>

  <section class="panes" id="panes" hidden>
    <div class="pane">
      <canvas id="cBfs" aria-label="BFS search"></canvas>
      <div class="hud"><div class="name">BFS</div><div class="counts"><div class="n" id="nBfs">0</div><div>checked</div></div></div>
      <div class="state" id="stBfs">&nbsp;</div>
    </div>
    <div class="pane">
      <canvas id="cBi" aria-label="Bidirectional BFS search"></canvas>
      <div class="hud"><div class="name">Bidirectional BFS</div><div class="counts"><div class="n" id="nBi">0</div><div>checked</div></div></div>
      <div class="state" id="stBi">&nbsp;</div>
    </div>
  </section>

  <section id="results" aria-live="polite">
    <p id="chain"></p>
  </section>
</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString();
const tick = () => new Promise(r => setTimeout(r, 20));

/* ================= Data (filled by loadData) ================= */
let A = 0, M = 0, N = 0;
let names = [], titles = [], off = null, adj = null, didx = null;

async function fetchGz(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('could not download ' + url + ' (' + res.status + ')');
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader(), parts = []; let got = 0, last = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    const now = performance.now();
    if (now - last > 150) { last = now; $('#loaded').textContent = 'Loading ' + label + ' ' + (total ? Math.round(got / total * 100) + '%' : (got / 1e6).toFixed(1) + ' MB') + '...'; }
  }
  $('#loaded').textContent = 'Unpacking ' + label + '...'; await tick();
  const bin = atob((await new Blob(parts).text()).trim()), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).arrayBuffer();
}

async function loadData() {
  const t0 = performance.now(), dec = new TextDecoder('utf-8');
  names = dec.decode(await fetchGz('data/names.txt', 'actors')).split('\n');
  titles = dec.decode(await fetchGz('data/titles.txt', 'movies')).split('\n');
  const buf = await fetchGz('data/edges.txt', 'credits');
  $('#loaded').textContent = 'Building the graph...'; await tick();
  const head = new DataView(buf, 0, 12);
  A = head.getUint32(0, true); M = head.getUint32(4, true); const E = head.getUint32(8, true); N = A + M;
  if (names.length !== A || titles.length !== M) throw new Error('the data files do not match');
  const bytes = new Uint8Array(buf, 12);
  const ca = new Int32Array(E), cm = new Int32Array(E);
  let p = 0, n = 0;
  const readVar = () => { let r = 0, sh = 0, b; do { b = bytes[p++]; r += (b & 127) * 2 ** sh; sh += 7; } while (b & 128); return r; };
  for (let m = 0; m < M; m++) {
    const cnt = readVar(); let prev = 0;
    for (let j = 0; j < cnt; j++) { prev += readVar(); ca[n] = prev; cm[n] = m; n++; }
  }
  off = new Int32Array(N + 1);
  for (let i = 0; i < n; i++) { off[ca[i] + 1]++; off[A + cm[i] + 1]++; }
  for (let i = 0; i < N; i++) off[i + 1] += off[i];
  const fill = off.slice(0, N); adj = new Int32Array(2 * n);
  for (let i = 0; i < n; i++) { const a = ca[i], m = A + cm[i]; adj[fill[a]++] = m; adj[fill[m]++] = a; }
  didx = new Int32Array(N).fill(-1);
  let withActors = 0; for (let i = A; i < N; i++) if (off[i + 1] > off[i]) withActors++;
  $('#loaded').textContent = fmt(A) + ' actors | ' + fmt(M) + ' movies (' + fmt(withActors) + ' with actors) | ' + fmt(n) + ' credits loaded in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
}

const labelOf = v => v < A ? names[v] : titles[v - A];
const degree = v => off[v + 1] - off[v];

/* ================= The two searches, run on the full graph ================= */
function pathFrom(par, x) { const out = []; while (x >= 0) { out.push(x); x = par[x]; } return out; }

function runBfs(src, dst) {
  const t0 = performance.now();
  const par = new Int32Array(N).fill(-2), queue = new Int32Array(N);
  par[src] = -1; let h = 0, tl = 0; queue[tl++] = src;
  let found = src === dst, ea = 0, em = 0;
  while (h < tl && !found) {
    const u = queue[h++]; u >= A ? em++ : ea++;
    for (let k = off[u], e = off[u + 1]; k < e; k++) {
      const v = adj[k];
      if (par[v] === -2) { par[v] = u; queue[tl++] = v; if (v === dst) { found = true; break; } }
    }
  }
  const ms = performance.now() - t0;
  const pos = new Int32Array(N).fill(-1); for (let i = 0; i < h; i++) pos[queue[i]] = i;
  return { path: found ? pathFrom(par, dst).reverse() : null, order: queue, T: h, pos, dpar: par, nside: null, ea, em, ms };
}

function runBidir(src, dst) {
  const t0 = performance.now();
  const par = [new Int32Array(N).fill(-2), new Int32Array(N).fill(-2)];
  const dist = [new Int32Array(N).fill(-1), new Int32Array(N).fill(-1)];
  const dpar = new Int32Array(N).fill(-2), nside = new Uint8Array(N).fill(255);
  const order = new Int32Array(2 * N); let T = 0, ea = 0, em = 0;
  par[0][src] = -1; dist[0][src] = 0; par[1][dst] = -1; dist[1][dst] = 0;
  dpar[src] = -1; nside[src] = 0; if (dpar[dst] === -2) { dpar[dst] = -1; nside[dst] = 1; }
  let fr = [[src], [dst]], best = Infinity, m0 = -1, m1 = -1;
  if (src === dst) { best = 0; m0 = src; m1 = dst; }
  while (best === Infinity && fr[0].length && fr[1].length) {
    const s = fr[0].length <= fr[1].length ? 0 : 1, o = 1 - s, next = [];
    for (const u of fr[s]) {                 // finish the whole level before stopping
      order[T++] = u; u >= A ? em++ : ea++;
      for (let k = off[u], e = off[u + 1]; k < e; k++) {
        const v = adj[k];
        if (dist[o][v] >= 0) { const L2 = dist[s][u] + 1 + dist[o][v]; if (L2 < best) { best = L2; m0 = s === 0 ? u : v; m1 = s === 0 ? v : u; } }
        if (dist[s][v] < 0) {
          dist[s][v] = dist[s][u] + 1; par[s][v] = u; next.push(v);
          if (dpar[v] === -2) { dpar[v] = u; nside[v] = s; }
        }
      }
    }
    fr[s] = next;
  }
  const ms = performance.now() - t0;
  let path = null;
  if (best !== Infinity) path = pathFrom(par[0], m0).reverse().concat(pathFrom(par[1], m1));
  const pos = new Int32Array(N).fill(-1); for (let i = 0; i < T; i++) pos[order[i]] = i;
  return { path, order, T, pos, dpar, nside, ea, em, ms };
}

/* ================= Drawing: the path plus a random sample of what each search checked ================= */
let ND = 0, L = [], ED = [], X = new Float64Array(0), Y = X, VX = X, VY = X;
const sim = { alpha: 0 }; let dragId = -1, hover = -1, userMoved = false;
const cam = { x: 0, y: 0, k: 1 };
let seed = 5; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const RGB = [[96, 165, 250], [251, 146, 60]];
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const GREEN = '#4ade80';

function buildDisplay(rs, extra) {
  for (const v of L) didx[v] = -1;
  L = [];
  const add = v => { if (didx[v] === -1) { didx[v] = L.length; L.push(v); } };
  const chain = (r, v) => { while (v >= 0) { add(v); v = r.dpar[v]; } };
  for (const v of extra) add(v);
  for (const r of rs) { if (r.path) for (const v of r.path) add(v); }
  for (const r of rs) for (let j = 0; j < 90 && r.T > 0; j++) chain(r, r.order[Math.floor(rnd() * r.T)]);
  ND = L.length;
  const seen = new Set(); ED = [];
  for (const r of rs) for (let i = 0; i < ND; i++) {
    const p = r.dpar[L[i]]; if (p < 0) continue;
    const j = didx[p]; if (j < 0) continue;
    const key = j * 100000 + i; if (!seen.has(key)) { seen.add(key); ED.push([j, i]); }
  }
  X = new Float64Array(ND); Y = new Float64Array(ND); VX = new Float64Array(ND); VY = new Float64Array(ND);
  const R = Math.sqrt(ND) * 16;
  for (let i = 0; i < ND; i++) { const a = rnd() * 6.2832, r = Math.sqrt(rnd()) * R; X[i] = Math.cos(a) * r; Y[i] = Math.sin(a) * r; }
  for (let k = 0; k < 350; k++) layoutTick(1 - k / 350);
  sim.alpha = 0; userMoved = false; fit();
}
function layoutTick(alpha) {
  const rep = 2000 * (0.35 + 0.65 * Math.min(1, alpha));
  for (let i = 0; i < ND; i++) for (let j = i + 1; j < ND; j++) {
    const dx = X[i] - X[j], dy = Y[i] - Y[j], d2 = dx * dx + dy * dy + 0.5;
    if (d2 > 160000) continue;
    const f = rep / d2; VX[i] += dx * f; VY[i] += dy * f; VX[j] -= dx * f; VY[j] -= dy * f;
  }
  for (const [a, b] of ED) {
    const dx = X[b] - X[a], dy = Y[b] - Y[a], d = Math.sqrt(dx * dx + dy * dy) + 0.01, f = (d - 40) / d * 0.05;
    VX[a] += dx * f; VY[a] += dy * f; VX[b] -= dx * f; VY[b] -= dy * f;
  }
  for (let i = 0; i < ND; i++) {
    if (i === dragId) { VX[i] = VY[i] = 0; continue; }
    VX[i] = (VX[i] - X[i] * 0.004) * 0.82; VY[i] = (VY[i] - Y[i] * 0.004) * 0.82;
    X[i] += VX[i]; Y[i] += VY[i];
  }
}

class View {
  constructor(canvas, nEl, stEl) {
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.nEl = nEl; this.stEl = stEl;
    this.w = 0; this.h = 0; this.dpr = 1; this.r = null; this.running = false;
    new ResizeObserver(() => this.resize()).observe(canvas); this.resize();
  }
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = this.c.clientWidth; this.h = this.c.clientHeight;
    this.c.width = Math.max(1, Math.round(this.w * this.dpr)); this.c.height = Math.max(1, Math.round(this.h * this.dpr));
    if (!userMoved && ND) fit();
  }
  start(r, src, dst, speed) {
    this.r = r; this.src = src; this.dst = dst; this.speed = speed;
    this.p = 0; this.cursor = 0; this.ea = 0; this.em = 0; this.done = false; this.running = true;
    this.stEl.textContent = 'searching...'; this.nEl.textContent = '0';
    if (r.T === 0) this.finish();
  }
  update(dt) {
    if (!this.running || this.done) return;
    this.p = Math.min(this.r.T, this.p + dt / 1000 * this.speed);
    const target = Math.floor(this.p);
    while (this.cursor < target) { const u = this.r.order[this.cursor++]; u >= A ? this.em++ : this.ea++; }
    this.nEl.textContent = fmt(this.ea + this.em);
    if (this.p >= this.r.T) this.finish();
  }
  finish() {
    this.done = true; this.p = this.r.T;
    while (this.cursor < this.r.T) { const u = this.r.order[this.cursor++]; u >= A ? this.em++ : this.ea++; }
    this.nEl.textContent = fmt(this.ea + this.em);
    const P = this.r.path, n = P ? (P.length - 1) / 2 : 0;
    this.stEl.textContent = P ? 'found ' + n + (n === 1 ? ' movie' : ' movies') + ' apart in ' + this.r.ms.toFixed(0) + ' ms' : 'no connection found';
  }
  isDisc(v) { const r = this.r, pa = r.dpar[v]; if (pa === -1) return true; if (pa < 0) return false; const q = r.pos[pa]; return q >= 0 && q < Math.floor(this.p); }
  isExp(v) { const q = this.r.pos[v]; return q >= 0 && q < Math.floor(this.p); }
  side(v) { const s = this.r.nside; return s ? (s[v] === 1 ? 1 : 0) : 0; }
  toWorld(p) { return { x: (p.x - this.w / 2) / cam.k + cam.x, y: (p.y - this.h / 2) / cam.k + cam.y }; }
  hit(p) {
    const w = this.toWorld(p); let best = -1, bd = (14 / cam.k) ** 2;
    for (let i = 0; i < ND; i++) { const dx = X[i] - w.x, dy = Y[i] - w.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  label(ctx, i) {
    const k = cam.k, txt = labelOf(L[i]);
    ctx.font = (12 / k) + 'px system-ui, sans-serif'; ctx.lineWidth = 3 / k; ctx.strokeStyle = '#0f1115'; ctx.fillStyle = '#e8e8e8';
    ctx.strokeText(txt, X[i] + 7 / k, Y[i] - 7 / k); ctx.fillText(txt, X[i] + 7 / k, Y[i] - 7 / k);
  }
  draw() {
    if (!this.r || !this.w) return;
    const ctx = this.ctx, k = cam.k, r = this.r;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); ctx.clearRect(0, 0, this.w, this.h);
    ctx.save(); ctx.translate(this.w / 2, this.h / 2); ctx.scale(k, k); ctx.translate(-cam.x, -cam.y);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 1 / k; ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath();
    for (const [a, b] of ED) { ctx.moveTo(X[a], Y[a]); ctx.lineTo(X[b], Y[b]); }
    ctx.stroke();
    ctx.lineWidth = 1.8 / k;
    for (let i = 0; i < ND; i++) {
      const v = L[i], pa = r.dpar[v]; if (pa < 0) continue;
      const j = didx[pa]; if (j < 0 || !this.isDisc(v)) continue;
      ctx.strokeStyle = rgba(RGB[this.side(v)], 0.85);
      ctx.beginPath(); ctx.moveTo(X[j], Y[j]); ctx.lineTo(X[i], Y[i]); ctx.stroke();
    }
    const P = this.done && r.path ? r.path : null, pset = P ? new Set(P) : null;
    if (P) {
      ctx.strokeStyle = GREEN; ctx.lineWidth = 3.2 / k; ctx.beginPath();
      P.forEach((v, n) => { const i = didx[v]; n ? ctx.lineTo(X[i], Y[i]) : ctx.moveTo(X[i], Y[i]); });
      ctx.stroke();
    }
    for (let i = 0; i < ND; i++) {
      const v = L[i], mov = v >= A;
      let rad = 3.6, fill = '#6b7280';
      if (this.isDisc(v) || this.isExp(v)) fill = rgba(RGB[this.side(v)], 1);
      if (pset && pset.has(v)) { fill = GREEN; rad = 4.6; }
      if (v === this.src) { fill = rgba(RGB[0], 1); rad = 5.5; }
      if (v === this.dst) { fill = rgba(RGB[1], 1); rad = 5.5; }
      ctx.fillStyle = fill; ctx.beginPath();
      if (mov) ctx.rect(X[i] - rad, Y[i] - rad, rad * 2, rad * 2); else ctx.arc(X[i], Y[i], rad, 0, 6.2832);
      ctx.fill();
    }
    if (P) for (const v of P) this.label(ctx, didx[v]);
    else { this.label(ctx, didx[this.src]); this.label(ctx, didx[this.dst]); }
    if (hover >= 0 && hover < ND) this.label(ctx, hover);
    ctx.restore();
  }
}

const views = [];
const bfsView = new View($('#cBfs'), $('#nBfs'), $('#stBfs'));
const biView = new View($('#cBi'), $('#nBi'), $('#stBi'));
views.push(bfsView, biView);

function fit() {
  if (!ND) return;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < ND; i++) { x0 = Math.min(x0, X[i]); x1 = Math.max(x1, X[i]); y0 = Math.min(y0, Y[i]); y1 = Math.max(y1, Y[i]); }
  const w = Math.min(...views.map(v => v.w || 400), 4000), h = Math.min(...views.map(v => v.h || 400), 4000);
  cam.x = (x0 + x1) / 2;
  cam.k = Math.max(0.1, Math.min(3, Math.min(w / (x1 - x0 + 110), h / (y1 - y0 + 200))));
  cam.y = (y0 + y1) / 2 - 30 / cam.k;
}

for (const v of views) {
  const c = v.c; let mode = null, last = null;
  const local = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.addEventListener('pointerdown', e => {
    const p = local(e), id = v.hit(p); c.setPointerCapture(e.pointerId);
    if (id >= 0) { mode = 'node'; dragId = id; sim.alpha = 0.5; } else mode = 'pan';
    last = p; userMoved = true;
  });
  c.addEventListener('pointermove', e => {
    const p = local(e);
    if (mode === 'node') { const w = v.toWorld(p); X[dragId] = w.x; Y[dragId] = w.y; sim.alpha = Math.max(sim.alpha, 0.4); }
    else if (mode === 'pan') { cam.x -= (p.x - last.x) / cam.k; cam.y -= (p.y - last.y) / cam.k; }
    else hover = v.hit(p);
    last = p;
  });
  const end = () => { mode = null; dragId = -1; };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  c.addEventListener('pointerleave', () => { hover = -1; });
  c.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); cam.k = Math.max(0.1, Math.min(6, cam.k * Math.exp(-e.deltaY * 0.01))); userMoved = true; } }, { passive: false });
  c.addEventListener('dblclick', () => { userMoved = false; fit(); });
}

/* ================= Name lookup ================= */
function findActor(q) {
  const t = q.trim().toLowerCase(); if (!t) return { id: -1, count: 0 };
  let best = -1, bd = -1, count = 0;
  for (let i = 0; i < A; i++) {
    const nmI = names[i];
    if (nmI.length === t.length && nmI.toLowerCase() === t) { count++; const d = degree(i); if (d > bd) { bd = d; best = i; } }
  }
  return { id: best, count, movies: bd };
}
function suggest(q, list) {
  const t = q.trim().toLowerCase(); if (t.length < 3) return;
  const top = [];
  for (let i = 0; i < A; i++) {
    const nmI = names[i];
    if (nmI.length < t.length || !nmI.toLowerCase().includes(t)) continue;
    const d = degree(i);
    if (top.length < 8) { top.push([d, nmI]); top.sort((a, b) => a[0] - b[0]); }
    else if (d > top[0][0]) { top[0] = [d, nmI]; top.sort((a, b) => a[0] - b[0]); }
  }
  const seen = new Set(), opts = [];
  for (const [, n] of top.reverse()) if (!seen.has(n)) { seen.add(n); const o = document.createElement('option'); o.value = n; opts.push(o); }
  list.replaceChildren(...opts);
}
let sugTimer = null;
for (const [inp, list] of [['#inA', '#namesA'], ['#inB', '#namesB']]) {
  $(inp).addEventListener('input', () => { clearTimeout(sugTimer); sugTimer = setTimeout(() => suggest($(inp).value, $(list)), 200); });
}

/* ================= Run ================= */
let shown = true, results = null, busy = false;
async function run() {
  if (busy) return;
  const fa = findActor($('#inA').value), fb = findActor($('#inB').value);
  $('#inA').classList.toggle('bad', fa.id < 0); $('#inB').classList.toggle('bad', fb.id < 0);
  if (fa.id < 0 || fb.id < 0) {
    const bad = [fa.id < 0 ? '"' + $('#inA').value.trim() + '"' : null, fb.id < 0 ? '"' + $('#inB').value.trim() + '"' : null].filter(Boolean).join(' and ');
    $('#err').textContent = 'No actor named ' + bad + ' in the data. Check the spelling or pick from the suggestions.';
    return;
  }
  const notes = [];
  if (fa.count > 1) notes.push(fa.count + ' actors are named ' + $('#inA').value.trim() + '; using the one with the most movies (' + fa.movies + ')');
  if (fb.count > 1) notes.push(fb.count + ' actors are named ' + $('#inB').value.trim() + '; using the one with the most movies (' + fb.movies + ')');
  $('#err').textContent = '';
  busy = true; $('#run').disabled = true;
  $('#chain').textContent = 'Searching...';
  await tick();
  const a = fa.id, b = fb.id;
  const rB = runBfs(a, b), rI = runBidir(a, b);
  buildDisplay([rB, rI], [a, b]);
  const speed = Math.max(20, rB.T / 7);
  bfsView.start(rB, a, b, speed); biView.start(rI, a, b, speed);
  results = { rB, rI, a, b, notes }; shown = false;
  busy = false; $('#run').disabled = false;
}

function showResults() {
  shown = true;
  const P = results.rI.path;
  if (!P) { $('#chain').textContent = 'No connection found between these two actors.'; return; }
  const n = (P.length - 1) / 2;
  $('#chain').textContent = P.map(labelOf).join(' \u2192 ') + '  (' + n + (n === 1 ? ' movie' : ' movies') + ' apart)';
}

$('#ctl').addEventListener('submit', e => { e.preventDefault(); run(); });

(async () => {
  try {
    await loadData();
    $('#ctl').hidden = false; $('#panes').hidden = false;
    $('#inA').value = 'Julie Delpy'; $('#inB').value = 'Hugo Weaving';
    await tick(); run();
  } catch (err) {
    $('#loaded').textContent = 'Could not load the data: ' + err.message;
  }
})();

let prev = performance.now();
function frame(now) {
  const dt = Math.min(64, now - prev); prev = now;
  if (sim.alpha > 0.015) { layoutTick(sim.alpha); layoutTick(sim.alpha); sim.alpha *= 0.985; if (!userMoved) fit(); }
  for (const v of views) { v.update(dt); v.draw(); }
  if (!shown && bfsView.done && biView.done) showResults();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
